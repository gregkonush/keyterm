name: KeyTerm
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: 16.0
configs:
  Debug: debug
  Release: release
targets:
  KeyTerm:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: Sources/HostApp
    info:
      path: Sources/HostApp/Info.plist
      properties:
        CFBundleDisplayName: KeyTerm
        CFBundleName: KeyTerm
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.proompteng.keyterm
        PRODUCT_NAME: KeyTerm
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2A7V9GG6H6
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: KeyTermKeyboard

  KeyTermKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: Sources/KeyboardExtension
    info:
      path: Sources/KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: KeyTerm Keyboard
        CFBundleName: KeyTermKeyboard
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.proompteng.keyterm.keyboard
        PRODUCT_NAME: KeyTermKeyboard
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2A7V9GG6H6
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        APPLICATION_EXTENSION_API_ONLY: YES

  KeyTermKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: Tests/KeyboardExtensionTests
      - path: Sources/KeyboardExtension/KeyboardThemePalette.swift
      - path: Sources/KeyboardExtension/TerminalEscapeSequences.swift
      - path: Sources/KeyboardExtension/KeyboardViewController.swift
    dependencies:
      - target: KeyTermKeyboard
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  KeyTerm:
    build:
      targets:
        KeyTerm: all
        KeyTermKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: KeyTermKeyboardTests
    archive:
      config: Release
